<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/site.css"><title>Saludos y presentaciones · LinguaCode</title></head><body><header><a class="brand" href="../">Lingua<span>Code</span></a><p>Spanisch</p></header><main><section class="hero"><p class="eyebrow">Quiz</p><h1>Saludos y presentaciones</h1><p>Wähle jeweils die richtige Antwort.</p></section><section class="grid"><article id="quiz" aria-live="polite"></article></section></main><script>const questions=[['Wie sagt man „Guten Morgen“ auf Spanisch?',['Buenas noches','Buenos días','Hasta luego','Gracias'],1],['Was bedeutet „¿Cómo estás?“?',['Wo wohnst du?','Wie heißt du?','Wie geht es dir?','Wie alt bist du?'],2],['Welche Verabschiedung passt?',['Adiós','Por favor','Hola','Sí'],0]];let i=0,score=0;const el=document.querySelector('#quiz');function render(){if(i===questions.length){el.innerHTML=`<span class="tag">Ergebnis</span><h2>${score} von ${questions.length} richtig</h2><p>${score===questions.length?'¡Excelente!':'Gut gemacht – probiere es gern noch einmal.'}</p><div class="actions"><button onclick="i=0;score=0;render()">Erneut starten</button></div>`;return}const[q,options,answer]=questions[i];el.innerHTML=`<span class="tag">Frage ${i+1} von ${questions.length}</span><h2>${q}</h2><div class="actions">${options.map((option,n)=>`<button data-answer="${n}">${option}</button>`).join('')}</div><p id="feedback"></p>`;el.querySelectorAll('button').forEach(button=>button.onclick=()=>{const correct=+button.dataset.answer===answer;if(correct)score++;document.querySelector('#feedback').textContent=correct?'Richtig!':'Noch nicht richtig.';setTimeout(()=>{i++;render()},700)})}render()</script></body></html>
