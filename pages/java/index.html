<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b10"><title>Java-Lernen · LinguaCode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="../">Lingua<span>Code</span></a><div class="top-actions"><span id="xp">0 XP</span><button id="presentation" class="ghost" type="button">Presentation Mode</button></div></header>
<main class="app-shell">
  <section class="course-head"><div><p class="eyebrow">Informatik · EF/Q1/Q2</p><h1>Java Foundations</h1><p id="course-goal">Selbst programmieren. Ausführen. Verstehen.</p></div><div class="progress-box"><strong id="progress-text">0 %</strong><div class="progress-track"><div id="progress-bar"></div></div></div></section>
  <div class="workspace">
    <aside class="lesson-nav"><div class="panel-title"><span>LESSON</span><button id="mode" class="mode" type="button">Student</button></div><nav id="lessons" aria-label="Lektionen"></nav><div class="status-card"><span class="muted">Sicher</span><ul id="mastered"></ul></div></aside>
    <section class="lesson-content"><div id="lesson-intro" class="lesson-intro"></div><article id="task-card" class="task-card" aria-live="polite"></article></section>
  </div>
</main>
<script src="script.js" defer></script>
</body>
</html>
